name: Daily vardgaranti fetch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        run: python fetch.py

      - name: Commit data if changed
        run: |
          git config user.name "loftet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: daily update $(date -u +%F)"
            git push
          fi
